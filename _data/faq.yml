# Häufige Fragen. "a" darf einfaches HTML enthalten (<strong>, <a>, <br>).

- q: Was kostet ein Sanierungsfahrplan?
  a: >-
    Das Honorar richtet sich nach Größe und Komplexität des Gebäudes; Sie
    erhalten vorab ein schriftliches Angebot. Das BAFA übernimmt 50 % des
    Honorars – bei Ein- und Zweifamilienhäusern bis zu 650 €, ab drei
    Wohneinheiten bis zu 850 €. Den Förderantrag stelle ich für Sie, der
    Zuschuss wird mit meinem Honorar verrechnet. Als Kleinunternehmer nach
    § 19 UStG berechne ich keine Umsatzsteuer.

- q: Für welche Häuser gibt es die geförderte Beratung?
  a: >-
    Für Wohngebäude in Deutschland, deren Bauantrag mindestens zehn Jahre
    zurückliegt. Antragsberechtigt sind unter anderem Eigentümer und
    Wohnungseigentümergemeinschaften.

- q: Muss ich danach alle Maßnahmen umsetzen?
  a: >-
    Nein. Der Sanierungsfahrplan ist eine Empfehlung, kein Vertrag. Sie
    entscheiden, was Sie wann umsetzen. Maßnahmen aus dem Fahrplan können
    bis zu 15 Jahre nach seiner Erstellung mit dem iSFP-Bonus gefördert werden.

- q: Lohnt sich der Fahrplan auch für eine einzelne kleinere Maßnahme?
  a: >-
    Seit dem 21. Juli 2026 gibt es den iSFP-Bonus nur noch für den Teil der
    Kosten, der über 30.000 € liegt. Bei einer einzelnen kleineren Maßnahme
    bringt der Fahrplan deshalb keinen zusätzlichen Zuschuss – wohl aber die
    Sicherheit, dass sie zu den späteren Schritten passt. Im Erstgespräch sage
    ich Ihnen offen, ob er sich für Sie rechnet.

- q: Brauche ich für den Heizungstausch einen Energieberater?
  a: >-
    Nicht zwingend: Die Heizungsförderung der KfW beantragen Sie selbst, die
    nötige Bestätigung kann auch Ihr Fachbetrieb ausstellen. Sinnvoll ist eine
    unabhängige Prüfung vor allem vor der Entscheidung – also bevor Angebote
    unterschrieben sind.

- q: Was hat sich mit dem Gebäudemodernisierungsgesetz geändert?
  a: >-
    Am 21. Juli 2026 ist das Gebäudemodernisierungsgesetz (GModG) in Kraft
    getreten, zeitgleich wurden die Förderrichtlinien (BEG) überarbeitet. Was
    das konkret für Ihr Haus bedeutet, kläre ich gern im Erstgespräch.

- q: Sind Sie unabhängig?
  a: >-
    Ja. Ich verkaufe keine Produkte und erhalte keine Provisionen von
    Herstellern oder Handwerksbetrieben.

- q: Wie lange dauert eine Beratung?
  a: >-
    Der Vor-Ort-Termin dauert rund zwei bis drei Stunden. Den fertigen
    Sanierungsfahrplan bespreche ich mit Ihnen in der Regel wenige Wochen danach.
